backend:
  name: github
  repo: soycamiloramirez/camilo-website
  branch: main
  # OAuth hospedado en el mismo Vercel del sitio (API routes propios).
  base_url: https://camilo-ramirez.com
  auth_endpoint: api/oauth/authorize

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

site_url: https://camilo-ramirez.com
display_url: https://camilo-ramirez.com
logo_url: https://camilo-ramirez.com/favicon.svg

i18n:
  structure: single_file
  locales: [es]
  default_locale: es

collections:
  - name: blog
    label: Blog
    label_singular: Artículo
    folder: src/content/blog
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{date | date(''DD MMM YYYY'')}}'
    preview_path: blog/{{slug}}
    sortable_fields: [date, title]
    view_filters:
      - label: 'Negocios'
        field: categories
        pattern: negocios
      - label: 'Geopolítica'
        field: categories
        pattern: geopolitica
      - label: 'LATAM'
        field: categories
        pattern: latam
      - label: 'Aprende'
        field: categories
        pattern: aprende
      - label: 'Borradores'
        field: draft
        pattern: true
    fields:
      - { name: title, label: 'Título', widget: string, required: true }
      - {
          name: description,
          label: 'Descripción / Lede',
          widget: text,
          required: true,
          hint: 'Resumen corto para SEO (~150-200 caracteres). Se usa en buscadores y al compartir.',
        }
      - { name: date, label: 'Fecha', widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: true }
      - {
          name: categories,
          label: 'Categorías',
          widget: select,
          multiple: true,
          min: 1,
          options:
            [
              { label: 'Negocios y estrategia', value: 'negocios' },
              { label: 'Geopolítica y mercado', value: 'geopolitica' },
              { label: 'LATAM', value: 'latam' },
              { label: 'Aprende', value: 'aprende' },
            ],
          hint: 'Elige una o más. Un artículo puede vivir en varias secciones.',
        }
      - { name: episode, label: 'Episodio de Pertinente (opcional)', widget: number, required: false, value_type: int, min: 1 }
      - { name: draft, label: 'Borrador', widget: boolean, default: false, required: false, hint: 'Marca como borrador para que no salga publicado todavía.' }
      - { name: hidden, label: 'Oculto del listado', widget: boolean, default: false, required: false, hint: 'Si está activo, no aparece en /blog pero la URL sigue funcionando. Útil para style guide o piezas internas.' }
      - {
          name: tldr,
          label: 'TL;DR (opcional)',
          widget: text,
          required: false,
          hint: 'Resumen de 1-2 líneas que aparece como caja destacada arriba del cuerpo. Si lo dejas vacío, no aparece.',
        }
      - {
          name: pullquote,
          label: 'Pull-quote (opcional)',
          widget: text,
          required: false,
          hint: 'Frase fuerte del artículo que se renderiza grande en Fraunces italic con acento morado. Aparece al final del cuerpo. Si lo dejas vacío, no aparece.',
        }
      - {
          name: aside,
          label: 'Nota lateral (opcional)',
          widget: text,
          required: false,
          hint: 'Texto corto que flota a la derecha en desktop, debajo en mobile. Para datos secundarios o aclaraciones. Si lo dejas vacío, no aparece.',
        }
      - {
          name: hero_image,
          label: 'Imagen hero (opcional)',
          widget: image,
          required: false,
          hint: 'Imagen grande arriba del título. Si no la cargas, el post empieza con el título directo.',
        }
      - {
          name: body,
          label: 'Cuerpo',
          widget: markdown,
          required: true,
          hint: 'Markdown estándar. Elementos disponibles: ## (h2 con franja), ### (h3), > (cita Fraunces), - (lista con franja), 1. (lista numerada accent), --- (divider), `código`, ```bloques```, ![](imagen). NO uses # h1 (el título va arriba en el campo Título).',
        }
